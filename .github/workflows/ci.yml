name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Foundation tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build and typecheck
        run: npm run build
      - name: Smoke test localized routes
        run: |
          npm run start -- --port 3100 >/tmp/fieldforce-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3100/de >/dev/null; then break; fi
            sleep 1
          done
          for locale in de en es; do
            curl -fsS "http://localhost:3100/$locale" -o "/tmp/fieldforce-$locale.html"
            grep -q 'FieldForce Pro' "/tmp/fieldforce-$locale.html"
            grep -q "<html lang=\"$locale\"" "/tmp/fieldforce-$locale.html"
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/)
          test "$status" = '307' || test "$status" = '308'
